name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        run: |
          if [ -z "${{ vars.VITE_API_BASE }}" ]; then
            echo "::error::Settings → Secrets and variables → Actions → Variables 에 VITE_API_BASE(Workers 주소)를 등록하세요."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # 프로젝트 사이트(https://<user>.github.io/<repo>/)는 /<repo>/ 하위에서 서비스된다
          VITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
